[project]
name = "backend"
version = "0.1.0"
description = "Vietnamese Medical Consultation Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "llama-index-core>=0.12.0",
    "llama-index-readers-file>=0.4.0",
    "llama-index-embeddings-huggingface>=0.5.0",
    "faiss-cpu>=1.9.0",
    "chromadb>=1.0.0,<2.0.0",
    "numpy>=1.26.0,<2.0.0",
    "rank-bm25>=0.2.2",
    "pyarrow>=18.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "vieneu>=3.2.3",
    "av>=15.0.0",
    "onnxruntime-gpu==1.20.1",
    "pyctcdecode>=0.5.0",
    "tokenizers>=0.20.0",
    "torch==2.5.1+cu118",
    "transformers==4.56.1",
]

[project.optional-dependencies]
asr-lm = ["kenlm>=0.3.0"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
