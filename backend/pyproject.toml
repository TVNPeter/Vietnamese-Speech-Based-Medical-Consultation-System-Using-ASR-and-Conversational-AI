[project]
name = "backend"
version = "0.1.0"
description = "Vietnamese Medical Consultation Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "llama-index-core>=0.12.0",
    "llama-index-readers-file>=0.4.0",
    "llama-index-embeddings-huggingface>=0.5.0",
    "faiss-cpu>=1.9.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "vieneu>=3.2.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
